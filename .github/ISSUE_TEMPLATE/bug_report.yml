name: Bug report
description: Report something that is broken or not working correctly.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Cali Central. Do not include passwords,
        access tokens, private athlete information, or submission data.

  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: Briefly explain what went wrong.
      placeholder: The competition page fails to load after selecting a country.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps that caused the problem.
      placeholder: |
        1. Open the competitions page
        2. Select United States
        3. Click Apply Filters
        4. The page becomes blank
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Explain what should have happened.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Explain what happened instead.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Homepage
        - Videos
        - News
        - Athlete profiles
        - Rankings
        - Competitions
        - Accounts and authentication
        - Submissions
        - Affiliate links
        - Admin dashboard
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 130 on Windows 11

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or additional context
      description: Remove private information before uploading anything.

  - type: checkboxes
    id: safety
    attributes:
      label: Privacy confirmation
      options:
        - label: I have not included passwords, tokens, private submissions, or personal data.
          required: true
